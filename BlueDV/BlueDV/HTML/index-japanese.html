    <style>


        @font-face {
            font-family: "D14MI";
            src: url('http://www.pa7lim.nl/BlueDVWEB/font.woff') format('woff');

        .D14MI {

        .david {

        .Clock-Wrapper {

        .Clock-Time-Background {

        .Clock-Year-Front {

        .dialogStatus2 {
            background-image: url("http://www.pa7lim.nl/BlueDVWEB/greyground.jpg");
        }

        #dialogStatus {

        }

        .david {

            border: 6px solid #000;

            height: 150px;
            width: 506px;

        }

        .wrapper {
            border: 6px solid #000;
            height: 50px;
            width: 350px;

            background-image: url("https://www.gsma.com/iot/wp-content/uploads/2016/02/Japan-city-Fuji.jpg");

<body>





    <div id="dialogStatus" title="状態" class="dialogStatus2">
        <table class="david" style="margin-top:60px; margin-left:45px;">
            <col>
            <tr align="justify"><th width="250">コールサイン   </th><th><div id="call"></div></th></tr>
            <tr align="justify"><th width="250">名前          </th><th><div id="Name"></div></th></tr>
            <tr align="justify"><th width="250">接続先        </th><th><div id="destination"></div></th></tr>
            <tr align="justify"><th width="250">ホームページ   </th><th><div id="hisdmrdest"></div></th></tr>

        </table>

        <div class="wrapper" style="margin-top:20px; margin-left:135px;" class="wrapperClass">
            <canvas class="visualizer" height="50"></canvas>
        </div>

    </div>

    <div id="networkdialogStatus" title="ホームページ" width="400">
        <table>
            <col width="130">

            <tr align="left"><td>モード            </td><td><div id="mode"></div></td></tr>
            <tr align="left"><td>接続数       </td><td><div id="connectedClients"></div></td></tr>

        </table>
    </div>


    <div id="motddialogStatus" title="メッセージ" width="100">
        <div id="motd"></div>        
    </div>

    <div id="dialogLastheard" title="交信履歴">
        <div id="lastHeardDiv" class="lastheardclass"></div>
    </div>

    <div id="aboutDialog" title="ヘルプ">
        <table>
            <col width="160">
            <tr align="left"><td>アプリケーション  </td><td>BlueDV Windows WEB</td></tr>
            <tr align="left"><td>開  発  者      </td><td>David PA7LIM</td></tr>
            <tr align="left"><td>翻  訳  者      </td><td>JH1TWX</td></tr>
            <tr align="left"><td>バージョン      </td><td><div id="version"></div></td></tr>
            <tr align="left"><td>ハードウェア     </td><td><div id="hardware"></div></td></tr>
            <tr align="left"><td>ホームページ      </td><td><a href="http://www.pa7lim.nl/" target="_blank">www.pa7lim.nl</a></td></tr>
            <tr align="left"><th>ボリューム         </th><th><input type="button" value="消音" id="MyMuteButton"><input type="button" value="消音解除" id="MyunmuteButton"></th></tr>

        </table>
    </div>

    <script>
        var lastHeard = [];
        var lastCall = "";


        $(function () {
            var ws = null;
            


            // websocket listener
            window.onload = function () {
                var voicePort = 7777;
                              

                $('#MyMuteButton').click(function () {
                    player.volume(0);
                });
                $('#MyunmuteButton').click(function () {
                    player.volume(1);
                });

                var socketURL = 'ws://' + window.location.hostname + ':' + General();
                var player = new PCMPlayer({
                    encoding: '16bitInt',
                    channels: 1,
                    sampleRate: 8000,
                    flushingTime: 1000
                });


                function start() {
                    ws = new WebSocket(socketURL);
                    ws.binaryType = 'arraybuffer';
                    ws.addEventListener('message', function (event) {
                        var data = new Uint8Array(event.data);
                        player.feed(data);

                    });
                    ws.onclose = function () {
                        // Try to reconnect in 5 seconds
                        document.getElementById("destination").innerHTML = "Reconnecting";
                        check();
                    };
                    ws.onerror = function () {
                        console.log('error');
                    };
                    player.volume(1);
                }


                function check() {
                    if (!ws || ws.readyState == 3) start();
                }

                start();

                setInterval(check, 5000);

            }


            $("#dialogStatus").dialog({
                closeOnEscape: false,
                resizable: false,
                width: 625,
                height: 390,
                position: { my: "left top", at: "left top", of: window },
                open: function (event, ui) {
                    $(".ui-dialog-titlebar-close", ui.dialog | ui).hide();
                }
            });

            $("#motddialogStatus").dialog({
                closeOnEscape: false,
                resizable: false,
                width: 400,
                height: 200,
                position: { my: "left top", at: "right top", of: window },
                open: function (event, ui) {
                    $(".ui-dialog-titlebar-close", ui.dialog | ui).hide();
                }
            });



            $("#dialogLastheard").dialog({
                closeOnEscape: false,
                width: 600,
                position: { my: "left top", at: "left center", of: window },
                open: function (event, ui) {
                    $(".ui-dialog-titlebar-close", ui.dialog | ui).hide();
                }
            });

            $("#networkdialogStatus").dialog({
                closeOnEscape: false,
                width: 400,
                position: { my: "left top", at: "right center", of: window },
                open: function (event, ui) {
                    $(".ui-dialog-titlebar-close", ui.dialog | ui).hide();
                }
            });

            $("#aboutDialog").dialog({
                closeOnEscape: false,
                width: 400,
                open: function (event, ui) {
                    $(".ui-dialog-titlebar-close", ui.dialog | ui).hide();
                }
            });


            setTimeout(startRefresh(), 1000);
            setTimeout(startNetworkRefresh(), 10000);
            setTimeout(startMotdRefresh(), 10000);
            General();
        });

        function startRefresh() {
            setTimeout(startRefresh, 1000);
            var xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var myObj = JSON.parse(this.responseText);
                    var id = myObj.hisdmrid;
                    var hisCall = myObj.Call;
                    var mode = myObj.mode;
                    document.getElementById("call").innerHTML = myObj.Call;
                    document.getElementById("destination").innerHTML = myObj.destination;

                    if (myObj.Call != lastCall) {
                        showQuery(myObj.Call, myObj.destination, myObj.mode);
                        lastCall = myObj.Call;
                    }

                    if (myObj.Call == "        " || myObj.Call == "0" || myObj.Call == null || myObj.Call == "" || myObj.destination == "0" ) {
                        clearScreen();
                    }

                } else {

                }
            };
            xmlhttp.open("GET", "/api/reccall", true);
            xmlhttp.send();

            var clearScreen = function () {
                document.getElementById("call").innerHTML = "";
                document.getElementById("destination").innerHTML = "";
                document.getElementById("Name").innerHTML = "";
            }

            var showQuery = function (idd, hisdest, mode) {
                var xmlhttp = new XMLHttpRequest();
                xmlhttp.onreadystatechange = function () {
                    if (this.readyState == 4 && this.status == 200) {
                        var myObj = JSON.parse(this.responseText);

                        try {
                            document.getElementById("Name").innerHTML = myObj[0].Name; // if name null.. FIXME:
                            if (myObj[0].Name != null)
                                lastHeard.push("<tr  align=\"left\"><td width=\"220\">" + myObj[0].Call + "</td><td width=\"320\">" + myObj[0].Name + "</td><td width=\"220\">" + hisdest + "</td><td width=\"120\">" + mode + "</td></tr>");
                            if (lastHeard.length > 10) lastHeard.shift();

                            $('#lastHeardDiv').html("<table><tr align=\"left\"><th>コールサイン</th><th>名前</th><th>リフレクター</th><th>モード</th></tr>" + lastHeard.join("") + "</table>");

                        }
                        catch (error) {
                            if (idd != '0') {
                                lastHeard.push("<tr  align=\"left\"><td width=\"220\">" + idd + "</td><td width=\"320\">" + "不明" + "</td><td width=\"220\">" + hisdest + "</td><td width=\"120\">" + mode + "</td></tr>");
                                if (lastHeard.length > 10) lastHeard.shift();

                                $('#lastHeardDiv').html("<table><tr align=\"left\"><th>コールサイン</th><th>名前</th><th>リフレクター</th><th>モード</th></tr>" + lastHeard.join("") + "</table>");
                            }
                        }
                    }
                };
                console.log("Call : [" + idd + "] mode [" + mode + "]");

                if (idd != "        " && mode != "IDLE" && idd != "") {
                    if (idd != null) {
                        xmlhttp.open("GET", "http://api.brandmeister.network/user_query.php?id=" + idd, true);
                        xmlhttp.send();
                    } else {
                        lastHeard.push("<tr  align=\"left\"><td width=\"220\">" + idd + "</td><td width=\"320\">" + "不明" + "</td><td width=\"220\">" + hisdest + "</td><td width=\"120\">" + mode + "</td></tr>");
                        if (lastHeard.length > 10) lastHeard.shift();

                        $('#lastHeardDiv').html("<table><tr align=\"left\"><th>コールサイン</th><th>名前</th><th>リフレクター</th><th>モード</th></tr>" + lastHeard.join("") + "</table>");
                    }
                }
            }
        }

        function startNetworkRefresh() {
            setTimeout(startNetworkRefresh, 10000);
            var xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var myObj = JSON.parse(this.responseText);
                    
                    document.getElementById("connectedClients").innerHTML = myObj.connectedClients;
                    document.getElementById("mode").innerHTML = myObj.mode;


                }
            };
            xmlhttp.open("GET", "/api/networkstatus", true);
            xmlhttp.send();
        }

        function startMotdRefresh() {
            setTimeout(startMotdRefresh, 20000);
            var xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var myObj = JSON.parse(this.responseText);
                    document.getElementById("motd").innerHTML = myObj.motd;
                }
            };
            xmlhttp.open("GET", "/api/motd", true);
            xmlhttp.send();
        }

        function General() {
            var xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var myObj = JSON.parse(this.responseText);
                    voicePort = myObj.voiceport ;
                    document.getElementById("version").innerHTML = myObj.appVersion;
                    document.getElementById("hardware").innerHTML = myObj.radio_version;
                }
            };
            xmlhttp.open("GET", "/api/general", false); //sync
            xmlhttp.send();
            return voicePort;
        }

    </script>
</body>
